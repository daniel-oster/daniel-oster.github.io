<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="og" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#E53000"/>
    </linearGradient>
    <linearGradient id="pg" x1="40%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C27B0"/>
      <stop offset="100%" stop-color="#4A148C"/>
    </linearGradient>
    <linearGradient id="opg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="45%" stop-color="#CC4400"/>
      <stop offset="55%" stop-color="#7B1FA2"/>
      <stop offset="100%" stop-color="#4A148C"/>
    </linearGradient>
    <linearGradient id="cg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8800"/>
      <stop offset="100%" stop-color="#FF1100"/>
    </linearGradient>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FF8C00"/>
      <stop offset="49%"  stop-color="#FF8C00"/>
      <stop offset="51%"  stop-color="#7B3FE4"/>
      <stop offset="100%" stop-color="#7B3FE4"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="500" height="500" fill="#0D0B1A"/>

  <!-- ── LEFT PANEL (orange) ── -->
  <!-- Vertical left bar: trapezoid, angled bottom-right -->
  <polygon points="118,68  172,68  172,348  118,290" fill="url(#og)"/>
  <!-- Top horizontal bar -->
  <polygon points="118,68  332,68  332,118  118,118" fill="url(#og)"/>

  <!-- ── RIGHT PANEL (purple) ── -->
  <!-- Vertical right bar: trapezoid, angled bottom-left -->
  <polygon points="278,118  332,68  382,160  382,348  278,348" fill="url(#pg)"/>

  <!-- ── FOLD/SPINE highlight (where the two panels meet) ── -->
  <!-- Thin diagonal crease suggesting 3-D fold -->
  <polygon points="172,118  278,68  278,348  172,348" fill="#0D0B1A" opacity="0.75"/>

  <!-- ── CHART inside the dark inner window ── -->
  <!-- Pulse line: rises then crashes down with arrow -->
  <polyline
    points="155,255  178,195  197,228  218,188  237,220  255,310"
    stroke="url(#cg)" stroke-width="10" fill="none"
    stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow head pointing down -->
  <polygon points="242,300  255,335  268,300" fill="#E53000"/>

  <!-- ── TEXT ── -->
  <text x="250" y="430"
    text-anchor="middle"
    font-family="'Arial Rounded MT Bold','Nunito','Arial',sans-serif"
    font-size="64" font-weight="900" letter-spacing="0">
    <tspan fill="#FF8C00">Press</tspan><tspan fill="#7B3FE4">Less</tspan>
  </text>
</svg>
